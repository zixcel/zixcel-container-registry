name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install OS custody build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash -n scripts/*.sh scripts/acceptance/*.sh
      - run: bash scripts/acceptance/keyring.sh
      - name: Verify native package and dependency notices
        env:
          ZIX_RELEASE_SOURCE: ${{ github.sha }}
        run: |
          strip --strip-debug target/debug/zix-docker
          cargo run --locked --bin zix-docker-package -- target/debug/zix-docker package-check x86_64-unknown-linux-gnu
          (cd package-check && sha256sum --check SHA256SUMS)
          (cd package-check/$(find package-check -mindepth 1 -maxdepth 1 -type d -printf '%f\n') && sha256sum --check CONTENTS.sha256)
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
