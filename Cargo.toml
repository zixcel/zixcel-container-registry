[package]
name = "zixcel-container-registry"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-container-registry"
description = "Bounded Docker Hub observations and explicit operator-reviewed retirement"
keywords = ["docker", "registry", "cli", "ai-agents", "local-first"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
zix-operation-contracts = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
zeroize = "1.9"
getrandom = "0.4"
crowsi-credential-broker = { version = "0.1.2", default-features = false, features = ["linux-secret-service"] }

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "zix-docker"
path = "src/main.rs"

[[bin]]
name = "zix-docker-package"
path = "tools/package.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
